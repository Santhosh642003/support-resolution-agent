[project]
name = "support-agent-backend"
version = "0.1.0"
description = "Simulated customer-support resolution agent (all data synthetic)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27,<0.29",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs live network or API key; excluded from CI"]
addopts = "-m 'not network'"
filterwarnings = [
    # Starlette's TestClient warns that httpx is deprecated in favor of httpx2; test-only, revisit at M3 only if starlette breaks.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
