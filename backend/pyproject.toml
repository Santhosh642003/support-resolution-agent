[project]
name = "support-agent-backend"
version = "0.1.0"
description = "Simulated customer-support resolution agent (all data synthetic)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27,<0.29",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
"alembic/versions/*" = ["E501"]  # embedded SQL
"scripts/*" = ["S101", "E501", "T201"]  # one-off tooling run outside the project env

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "alembic"]
# scripts/ holds one-off tooling that runs in a throwaway env (needs torch); excluded so bare
# `mypy .` and `uv run mypy` check the same thing.
exclude = ["^scripts/"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true  # onnxruntime ships no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs live network or API key; excluded from CI"]
addopts = "-m 'not network'"
filterwarnings = [
    # Starlette's TestClient warns that httpx is deprecated in favor of httpx2; test-only, revisit at M3 only if starlette breaks.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
